# rules.conf - starter rule set for the IDS rule engine (internal/rules).
#
# Format, one rule per line ('#' starts a comment line):
#
#   action proto src_addr src_port direction dst_addr dst_port (options)
#
#   action     alert | pass (pass rules are checked first and silence a packet)
#   proto      ip | tcp | udp | icmp | arp
#   addresses  any, 10.0.0.1, 10.0.0.0/8, 2001:db8::/32, [a,b,!c], !a
#   ports      any, 80, 1024:65535, :1023, [80,443,8000:8100], !22
#   direction  -> or <> (both ways)
#
# Options (see internal/rules/doc.go for the full list):
#   msg:"..."; sid:N; rev:N; severity:low|medium|high|critical; category:NAME;
#   flags:S | S+ | 0; content:"..." [nocase]; app_proto:dns|http|ftp|tls;
#   app_field:KEY=VALUE; app_reason:malformed|suspicious;
#   detection_filter:track by_src|by_dst, count N, seconds S;
#   detect:syn_flood; track:by_src|by_dst; count:N; seconds:S; min_incomplete_ratio:F;
#
# Alerts are deduplicated per (sid, address) for 60s: the first match
# alerts, later ones are folded into one summary when the window closes.
#
# Local sids start at 1000000.

# ---------------------------------------------------------------- dos
# SYN flood against one destination. Catches spoofed floods, where every
# SYN has a different fake source. Fires when 100 handshakes to the same
# server are left incomplete (reset, unanswered or timed out after 3s)
# within 5s and at least 80% of that server's handshakes in that span failed.
alert tcp any any -> any any (msg:"SYN flood against one destination"; detect:syn_flood; track:by_dst; count:100; seconds:5; min_incomplete_ratio:0.8; sid:1000001; rev:1; severity:high; category:dos;)

# SYN flood (or aggressive SYN scan) from one source.
alert tcp any any -> any any (msg:"SYN flood from one source"; detect:syn_flood; track:by_src; count:100; seconds:5; min_incomplete_ratio:0.8; sid:1000002; rev:1; severity:high; category:dos;)

# ---------------------------------------------------------------- dns
# Zone transfer request: leaks the whole zone if the server allows it.
alert ip any any -> any any (msg:"DNS zone transfer (AXFR) request"; app_proto:dns; app_field:is_response=false; app_field:qtype_name=AXFR; sid:1000101; rev:1; severity:medium; category:recon;)

# DNS message that does not parse: evasion attempt, fuzzing or a broken client.
alert ip any any -> any any (msg:"Malformed DNS message"; app_proto:dns; app_reason:malformed; sid:1000102; rev:1; severity:low; category:dns;)

# --------------------------------------------------------------- http
# Credentials sent with HTTP Basic auth over cleartext HTTP.
alert tcp any any -> any any (msg:"HTTP Basic auth over cleartext"; app_proto:http; app_field:auth_basic=true; sid:1000201; rev:1; severity:medium; category:credential;)

# Double percent-encoding in the URI ("%252e" decodes to "%2e"): used to
# slip ../ and similar past filters that decode only once.
alert tcp any any -> any any (msg:"HTTP URI with double percent-encoding"; app_proto:http; app_reason:suspicious; content:"%25"; sid:1000202; rev:1; severity:medium; category:web-attack;)

# ---------------------------------------------------------------- ftp
# Cleartext FTP password (the parser redacts the value).
alert tcp any any -> any 21 (msg:"FTP password sent in cleartext"; app_proto:ftp; app_field:command=PASS; sid:1000301; rev:1; severity:medium; category:credential;)

# FTP brute force: 5 failed logins (530 replies) to the same client within
# 30s. The 530 is sent by the server, so the client is the destination.
alert tcp any 21 -> any any (msg:"FTP brute force (repeated 530 login failures)"; app_proto:ftp; app_field:response_code=530; detection_filter:track by_dst, count 5, seconds 30; sid:1000302; rev:1; severity:high; category:credential;)
